services:
  - type: web
    name: ajo-thrift
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_SESSION_MAX_AGE_SECONDS
        value: "604800"
